<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
    <meta name="description" content="{{description}}">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient-1: #fdfbfb;
            --bg-gradient-2: #ebedee;
            --glass-bg: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(255, 255, 255, 0.6);
            --text-main: #2d3748;
            --text-muted: #718096;
            --accent: #4f46e5;
            --accent-hover: #4338ca;
            --surface: #ffffff;
        }

        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            color: var(--text-main);
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
            background-attachment: fixed;
            margin: 0;
            padding: 0;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        /* Glassmorphism Container */
        .container {
            max-width: 800px;
            margin: 40px 20px;
            padding: 50px 60px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Header / Meta section */
        header {
            margin-bottom: 40px;
            text-align: center;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            line-height: 1.4;
            margin-bottom: 16px;
            color: #1a202c;
            letter-spacing: -0.02em;
        }

        .meta-description {
            font-size: 1.05rem;
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-bottom: 30px;
        }

        .tag {
            background: rgba(79, 70, 229, 0.1);
            color: var(--accent);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        
        .tag:hover {
            background: var(--accent);
            color: white;
            transform: translateY(-2px);
        }

        .source-link {
            display: inline-block;
            margin-top: 10px;
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        .source-link:hover {
            color: var(--accent-hover);
            text-decoration: underline;
        }

        /* Markdown Content Styling */
        .content {
            font-size: 1.05rem;
        }

        .content h2 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-top: 48px;
            margin-bottom: 20px;
            padding-bottom: 8px;
            border-bottom: 2px solid rgba(0,0,0,0.05);
            color: #1a202c;
        }

        .content h3 {
            font-size: 1.3rem;
            font-weight: 600;
            margin-top: 36px;
            margin-bottom: 16px;
            color: #2d3748;
        }

        .content p {
            margin-bottom: 20px;
        }

        .content ul, .content ol {
            margin-bottom: 24px;
            padding-left: 24px;
        }

        .content li {
            margin-bottom: 8px;
        }

        .content strong {
            font-weight: 700;
            color: #1a202c;
            background: linear-gradient(transparent 60%, rgba(79, 70, 229, 0.2) 60%);
        }

        .content table {
            width: 100%;
            border-collapse: collapse;
            margin: 32px 0;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }

        .content th, .content td {
            padding: 14px 20px;
            text-align: left;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .content th {
            background: rgba(0,0,0,0.03);
            font-weight: 600;
            color: #4a5568;
        }

        .content tr:last-child td {
            border-bottom: none;
        }
        
        .content blockquote {
            margin: 24px 0;
            padding: 16px 24px;
            background: rgba(79, 70, 229, 0.05);
            border-left: 4px solid var(--accent);
            border-radius: 0 8px 8px 0;
            color: #4a5568;
            font-style: italic;
        }

        .content hr {
            border: 0;
            height: 1px;
            background: rgba(0,0,0,0.1);
            margin: 40px 0;
        }

        /* === Scene Capture Images === */
        .hero-image {
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            margin: 24px 0 36px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.12);
        }

        .hero-image img {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.4s ease;
        }

        .hero-image img:hover {
            transform: scale(1.02);
        }

        .scene-capture {
            margin: 24px 0 32px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.10);
            background: rgba(255,255,255,0.6);
            border: 1px solid rgba(255,255,255,0.8);
        }

        .scene-capture img {
            width: 100%;
            height: auto;
            display: block;
        }

        .scene-caption {
            padding: 10px 16px;
            font-size: 0.82rem;
            color: var(--text-muted);
            font-style: italic;
            border-top: 1px solid rgba(0,0,0,0.05);
            background: rgba(255,255,255,0.4);
        }

        .scene-caption::before {
            content: '📸 ';
        }

        /* Google AdSense 広告枠スタイル */
        .ad-container {
            margin: 32px 0;
            text-align: center;
        }
        .ad-notice {
            font-size: 0.72rem;
            color: #9ca3af;
            letter-spacing: 0.05em;
            margin-bottom: 6px;
            display: block;
            text-transform: uppercase;
        }
        .ad-box {
            background: rgba(255, 255, 255, 0.75);
            border: 1px dashed #cbd5e1;
            border-radius: 14px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
            font-size: 0.82rem;
            min-height: 120px;
            transition: all 0.2s;
        }
        .ad-box:hover {
            border-color: #94a3b8;
            background: rgba(255, 255, 255, 0.95);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                margin: 14px 10px;
                padding: 24px 18px;
                border-radius: 16px;
            }
            h1 {
                font-size: 1.5rem;
                line-height: 1.4;
            }
            .meta-description {
                font-size: 0.92rem;
            }
            .content {
                font-size: 0.98rem;
            }
            .content h2 {
                font-size: 1.35rem;
                margin-top: 36px;
            }
            .content h3 {
                font-size: 1.15rem;
            }
            .content table {
                display: block;
                overflow-x: auto;
                white-space: nowrap;
            }
            .footer-links-wrap {
                flex-direction: column;
                align-items: stretch !important;
                gap: 16px !important;
            }
            .footer-sub-links {
                display: flex;
                gap: 8px !important;
                overflow-x: auto;
                white-space: nowrap;
                -webkit-overflow-scrolling: touch;
                padding-bottom: 4px;
                scrollbar-width: none;
            }
            .footer-sub-links::-webkit-scrollbar {
                display: none;
            }
            .footer-sub-links a {
                padding: 6px 12px;
                background: rgba(0, 0, 0, 0.04);
                border-radius: 14px;
                font-size: 0.82rem !important;
                flex-shrink: 0;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div style="margin-bottom: 24px;">
        <a href="index.html" style="display: inline-flex; align-items: center; gap: 6px; text-decoration: none; color: #4f46e5; font-weight: 600; font-size: 0.92rem; background: rgba(255,255,255,0.85); padding: 8px 16px; border-radius: 20px; border: 1px solid rgba(79,70,229,0.2); transition: all 0.2s; box-shadow: 0 2px 6px rgba(0,0,0,0.03);">← ブログトップに戻る</a>
    </div>

    <header>
        <h1>{{title}}</h1>
        <p class="meta-description">{{description}}</p>
        
        <div class="tags">
            {{tags_html}}
        </div>

        {{source_link_html}}

        {{hero_image_html}}
    </header>

    <!-- 記事上部 AdSense 広告枠 -->
    <div class="ad-container ad-article-top">
        <span class="ad-notice">スポンサーリンク</span>
        <div class="ad-box">
            <!-- Google AdSense Responsive Ad Code Here -->
            <span>広告スペース（AdSense レスポンシブ広告）</span>
        </div>
    </div>

    <div class="content">
        {{content}}
    </div>

    <!-- 記事下部 AdSense 広告枠 -->
    <div class="ad-container ad-article-bottom">
        <span class="ad-notice">スポンサーリンク</span>
        <div class="ad-box">
            <!-- Google AdSense Matched Content / Bottom Ad Code Here -->
            <span>広告スペース（AdSense 記事下広告）</span>
        </div>
    </div>

    <div class="footer-links-wrap" style="margin-top: 40px; padding-top: 24px; border-top: 1px solid rgba(0,0,0,0.08); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
        <a href="index.html" style="display: inline-flex; align-items: center; gap: 6px; text-decoration: none; color: #4f46e5; font-weight: 600;">← トップページに戻る</a>
        <div class="footer-sub-links" style="display: flex; gap: 16px; font-size: 0.9rem;">
            <a href="pages/about.html" style="text-decoration: none; color: #6b7280;">このサイトについて</a>
            <a href="pages/contact.html" style="text-decoration: none; color: #6b7280;">お問い合わせ</a>
            <a href="pages/privacy_policy.html" style="text-decoration: none; color: #6b7280;">プライバシーポリシー</a>
            <a href="pages/operator_info.html" style="text-decoration: none; color: #6b7280;">運営者情報</a>
        </div>
    </div>
</div>

</body>
</html>
